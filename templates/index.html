<!DOCTYPE html>
<html>

<head>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>
    <div id="sidebar" class="sidebar">
        <h1>Capture</h1>

        <h2>Snapshot</h2>
        <button id="snapshotBtn">
            Snapshot
            <span class="save-dot"></span>
        </button>

        <br>

        <h2>Recording</h2>
        <div class="record-btns">
            <button id="startRecordBtn">Start</button>
            <button id="stopRecordBtn" disabled>
                Stop
                <span class="save-dot red-dot"></span>
            </button>
        </div><br>

        <hr style="border: 0; height: 3px; background: #444; margin: 10px 0;">

        <!-- <button id="changeDownloadDirBtn">
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="white" viewBox="0 0 24 24">
                <path d="M10 4H2v16h20V6H12l-2-2z" />
            </svg>
            Download Folder
        </button>  -->
        <div id="downloadDirRow" style="display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-top: auto;">
            <div>
                <span>Save to:</span>
                <span id="folderNameLabel">No folder selected</span>
            </div>
            <button id="editDownloadDirBtn"
                style="padding: 10px; background-color: #2c2c2c; color: white; border: 1px solid #555; border-radius: 4px; cursor: pointer; transition: background-color 0.2s ease;">
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="white" viewBox="0 0 24 24">
                    <path
                        d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zM20.71 7.04a1 1 0 0 0 0-1.41l-2.34-2.34a1 1 0 0 0-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z" />
                </svg>
            </button>
        </div>

    </div>

    <button class="toggle-btn" onclick="toggleSidebar()">
        <div class="bar top"></div>
        <div class="bar middle"></div>
        <div class="bar bottom"></div>
    </button>

    <div class="main-content">
        <div style="position: relative; width: 100%; height: 100vh; overflow: hidden;">
            <img src="{{ url_for('video') }}"
                style="position: absolute; width: 100%; height: 100%; object-fit: cover; filter: blur(20px); transform: scale(1.1); z-index: 0;" />

            <div
                style="position: relative; display: flex; align-items: center; justify-content: center; height: 100%; z-index: 1;">
                <img id="mainVideoFeed" src="{{ url_for('video') }}" style="height: 100%; object-fit: contain;" />
            </div>
        </div>
    </div>

    <canvas id="captureCanvas" style="display:none;"></canvas>

    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>

</html>
